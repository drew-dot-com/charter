# charter-door on Drew's node (Hetzner). Nothing is host-published: the door
# joins the node's network so Caddy reaches it as http://charter-door:3701.
# Public names and security headers are in Caddy.snippet: charterhome.dev (API, landing page at /), rent.charterhome.dev (storefront)
# The old names stay as aliases (see Caddy.snippet).
#
# CHARTER_DOOR_HOME (default /root/charter-door), owned by uid 1000 (the image's
# `node` user), mode 700:
#   door.env          optional settings (door.env.example)
#   data/             the ledger, the host registry, the door's host channel records, cached output
#   secrets/          door-payer.key (0400: the door's Base key; renters pay it, it pays hosts),
#                     claim-key (0400, from new-claim-key.mjs: the x402 claim authorizer, no funds)
#                     cdp-key.json (0400, optional: the CDP portal's API key download; CHARTER_CDP_KEY_FILE in door.env)
#
# data/host-channels/ holds what the door has charged on each host's channel; a lost record is rebuilt
# from chain, but back it up.
services:
  charter-door:
    build:
      context: ../..
      dockerfile: deploy/door/Dockerfile
    image: charter-door:local
    container_name: charter-door
    env_file: ${CHARTER_DOOR_HOME:-/root/charter-door}/door.env
    environment:
      CHARTER_DOOR_HOST: 0.0.0.0
      CHARTER_DOOR_PORT: '3701'
      CHARTER_DOOR_TRUST_PROXY: '1'
      CHARTER_DATA_DIR: /data
      CHARTER_DOOR_PAYER_KEY_FILE: /secrets/door-payer.key
      CHARTER_CLAIM_KEY_FILE: /secrets/claim-key
    volumes:
      - ${CHARTER_DOOR_HOME:-/root/charter-door}/data:/data
      - ${CHARTER_DOOR_HOME:-/root/charter-door}/secrets:/secrets:ro
    expose: ['3701']
    networks: [relay_deploy_net]
    restart: unless-stopped

  # charter-social: Charter's X account (docs/ops.md, "charter-social"). Same image, its own entry. It reads the
  # door's data read-only and never sees the door's secrets. CHARTER_SOCIAL_HOME (default /root/charter-social),
  # owned by uid 1000, mode 700: social.env (deploy/social/social.env.example), state/, config/ (facts.md,
  # rules.json, optins.json, blocklist.json), secrets/telegram.token (0400).
  # Profile `social`: a plain `up` or `config` leaves it out (and never needs social.env); start it with
  # `--profile social up -d charter-social`.
  charter-social:
    profiles: [social]
    image: charter-door:local
    container_name: charter-social
    command: ['node', 'dist/social/main.js']
    env_file: ${CHARTER_SOCIAL_HOME:-/root/charter-social}/social.env
    environment:
      CHARTER_DATA_DIR: /data
      STATE_DIR: /state
      CONFIG_DIR: /config
      CHARTER_DOOR_URL: http://charter-door:3701
      TELEGRAM_BOT_TOKEN_FILE: /secrets/telegram.token
    volumes:
      - ${CHARTER_DOOR_HOME:-/root/charter-door}/data:/data:ro
      - ${CHARTER_SOCIAL_HOME:-/root/charter-social}/state:/state
      - ${CHARTER_SOCIAL_HOME:-/root/charter-social}/config:/config:ro
      - ${CHARTER_SOCIAL_HOME:-/root/charter-social}/secrets:/secrets:ro
    healthcheck:
      disable: true
    networks: [relay_deploy_net]
    restart: unless-stopped

networks:
  relay_deploy_net:
    external: true
